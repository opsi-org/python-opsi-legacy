[project]
name = "python-opsi-legacy"
version = "4.3.13.0"
description = "The opsi python library"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.15"
dependencies = [
	"colorlog>=6.6",
	"cryptography>=42.0",
	"distro>=1.6",
	"lz4>=4.0",
	"msgpack>=1.0",
	"packaging>=24.1",
	"pefile>=2022.5",
	"pexpect>=4.8",
	"psutil>=6.0",
	"pyasn1>=0.6",
	"pycryptodome>=3.10",
	"python-opsi>=4.3.15.14,<4.4",
	"python-pam>=2.0",
	"pywin32>=303; platform_system == 'Windows'",
	"pyzsync>=1.2",
	"ruyaml>=0.91",
	"service-identity>=24.1",
	"six>=1.16",
	"sqlalchemy>=1.4,<2.0",
	"tomlkit>=0.13",
	"typing-extensions>=4.12",
	"wmi>=1.5; platform_system == 'Windows'",
]

[[project.authors]]
name = "uib GmbH"
email = "info@uib.de"

[[project.maintainers]]
name = "uib GmbH"
email = "info@uib.de"

[project.urls]
Homepage = "https://www.opsi.org"

[dependency-groups]
dev = [
	"mock>=5.0",
	"pytest-asyncio>=0.24",
	"pytest-cov>=5.0",
	"pytest>=8.3",
	"ruff>=0.7",
	"ty>=0.0.32",
]

[tool.uv]
extra-index-url = ["https://pypi.uib.gmbh/simple"]
index-strategy = "unsafe-best-match"
package = true

[tool.ruff]
line-length = 140

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
ignore = ["F405"]

[tool.setuptools.packages.find]
include = ["opsi_legacy", "opsi_legacy.*"]
